name: Build LiquidifyUnlock deb (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (roothide fork)
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          if [[ ! -d "$THEOS" ]]; then
            git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install deps
        run: |
          brew install dpkg ldid

      - name: Build roothide deb
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide \
            PACKAGE_VERSION=2.1.0-${{ github.run_number }}

      - name: Collect
        run: |
          mkdir -p output
          cp packages/*.deb output/ || cp .theos/packages/*.deb output/ 2>/dev/null || find . -name "*.deb" -exec cp {} output/ \;
          ls -lh output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidifyUnlock-roothide-deb
          path: output/*.deb
          retention-days: 30
