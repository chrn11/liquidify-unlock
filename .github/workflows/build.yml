name: Build LiquidifyUnlock deb (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg xz-utils fakeroot

      - name: Stage full-crack package (roothide native)
        run: |
          set -euo pipefail
          STG="$PWD/staging"
          mkdir -p "$STG/DEBIAN" \
                   "$STG/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cp assets/*.dylib assets/*.plist \
             "$STG/var/jb/Library/MobileSubstrate/DynamicLibraries/"

          cat > "$STG/DEBIAN/control" <<'EOF'
          Package: com.charlieleung.liquidify
          Name: Liquidify
          Version: 1.3.7-80~roothide
          Architecture: iphoneos-arm64e
          Description: Liquidify full crack (roothide native, arm64e)
          Maintainer: Charlie Leung
          Author: Charlie Leung
          Section: Tweaks
          Depends: mobilesubstrate (>= 0.9.5000)
          Installed-Size: 38700
          EOF

          LIBDIR="$STG/var/jb/Library/MobileSubstrate/DynamicLibraries"
          ln -sf "Liquidify.dylib"           "$LIBDIR/Liquidify.dylib.roothidepatch"
          ln -sf "LiquidifyGlassFix.dylib"   "$LIBDIR/LiquidifyGlassFix.dylib.roothidepatch"
          ln -sf "LiquidGlassKeyboard.dylib" "$LIBDIR/LiquidGlassKeyboard.dylib.roothidepatch"

      - name: Build deb
        run: |
          set -euo pipefail
          mkdir -p packages
          fakeroot dpkg-deb -Zxz --root-owner-group -b staging \
            packages/liquidify_1.3.7-80_roothide.deb
          ls -lh packages/

      - name: Verify
        run: |
          set -euo pipefail
          dpkg-deb --info packages/*.deb | head -14
          dpkg-deb -c packages/*.deb | grep -E "roothidepatch|\.dylib"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidify-roothide-deb
          path: packages/*.deb
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.7-80-roothide
          files: packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
