name: Build Liquidify native roothide deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          STG="$PWD/staging"
          LIB="$STG/var/jb/Library/MobileSubstrate/DynamicLibraries"
          mkdir -p "$STG/DEBIAN" "$LIB"
          install -m 0755 assets/*.dylib "$LIB/"
          install -m 0644 assets/*.plist "$LIB/"
          cp control-82 "$STG/DEBIAN/control"

      - name: Build native roothide deb
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          dpkg-deb -Zxz --root-owner-group -b staging packages/liquidify_1.3.7-82_roothide.deb
          dpkg-deb --info packages/*.deb
          dpkg-deb -c packages/*.deb | grep -E '\.dylib'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidify-1.3.7-82-roothide
          path: packages/*.deb
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.7-82-roothide
          files: packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
